<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Entrena · Jonathan V2.2</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ENTRENADOR DIGITAL</div>
        <h1>Entrena · Jonathan</h1>
      </div>
      <button id="installBtn" class="ghost hidden">Instalar</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="today" class="nav-btn active">🏠<span>Hoy</span></button>
      <button data-route="routine" class="nav-btn">🏋️<span>Rutina</span></button>
      <button data-route="exercises" class="nav-btn">📚<span>Ejercicios</span></button>
      <button data-route="progress" class="nav-btn">📈<span>Progreso</span></button>
      <button data-route="goalkeeper" class="nav-btn">🧤<span>Portero</span></button>
      <button data-route="settings" class="nav-btn">⚙️<span>Ajustes</span></button>
    </nav>
  </div>

  <template id="modalTpl">
    <div class="modal-backdrop">
      <div class="modal-card">
        <button class="modal-close" aria-label="Cerrar">✕</button>
        <div class="modal-body"></div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
